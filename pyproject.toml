[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kotak-fraudshield"
version = "1.0.0"
description = "Bounded-Optimal Real-Time Fraud, APP Scam & Mule Detection Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    "onnxruntime>=1.19.0",
    "onnxmltools>=1.12.0",
    "joblib>=1.4.0",
    "redis>=5.1.0",
    "aiokafka>=0.11.0",
    "asyncpg>=0.29.0",
    "networkx>=3.3",
    "prometheus-client>=0.21.0",
    "shap>=0.46.0",
    "langgraph>=0.2.30",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.112.0",
    "httpx>=0.27.0",
    "evidently>=0.4.35",
]

[tool.setuptools.packages.find]
where = ["src"]
